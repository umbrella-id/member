<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" />
    <title>Info - Umbrella</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/kas.css" />
    <link rel="stylesheet" href="css/crysta.css" />
    <link rel="stylesheet" href="css/saran.css" />
    <link rel="stylesheet" href="css/gate.css" />
</head>
<body>

    <!-- ===== GATE VERIFIKASI MEMBER ===== -->
    <div id="internalGate">
        <div class="gate-box">
            <div class="gate-icon">
                <i class="fas fa-shield-alt"></i>
            </div>
            <div class="gate-title">Verifikasi Member</div>
            <div class="gate-subtitle">Masukkan 6 digit terakhir nomor WhatsApp Anda untuk mengakses halaman ini.</div>
            
            <!-- FORM NORMAL (6 DIGIT) -->
            <div id="gateFormNormal">
                <div class="gate-form-group">
                    <label><i class="fas fa-key"></i> 6 Digit Terakhir WA</label>
                    <input type="tel" 
                           id="gateWaInput" 
                           class="gate-input" 
                           placeholder="123456" 
                           maxlength="6" 
                           inputmode="numeric"
                           pattern="[0-9]*"
                           autocomplete="off">
                </div>
                <button id="gateSubmitBtn" class="gate-btn" onclick="submitGate()">
                    <i class="fas fa-shield-alt"></i> VERIFIKASI
                </button>
            </div>
            
            <!-- FORM NOMOR LENGKAP (KALAU KEMBAR) -->
            <div id="gateFormFull" style="display: none;">
                <div class="gate-form-group">
                    <label><i class="fas fa-phone"></i> Nomor WA Lengkap</label>
                    <input type="tel" 
                           id="gateWaFullInput" 
                           class="gate-input" 
                           placeholder="628123456789" 
                           inputmode="numeric"
                           pattern="[0-9]*"
                           autocomplete="off">
                </div>
                <button id="gateSubmitFullBtn" class="gate-btn" onclick="submitGateFull()">
                    <i class="fas fa-shield-alt"></i> VERIFIKASI
                </button>
            </div>
            
            <div id="gateMessage" class="gate-message"></div>
            
            <div class="gate-hint">
                <i class="fas fa-info-circle"></i> Hanya member aktif Umbrella yang bisa mengakses halaman ini.
            </div>
        </div>
    </div>

    <!-- ===== FLOATING MENU ===== -->
    <div class="menu-float" id="menuToggle" aria-label="Menu">
        <i class="fas fa-bars"></i>
    </div>

    <!-- ===== FLOATING MENU PANEL ===== -->
    <div class="menu-overlay" id="menuOverlay"></div>
    <div class="menu-panel" id="menuPanel">
        <button class="close-btn" id="menuClose"><i class="fas fa-times"></i></button>
        <ul>
            <li class="active" data-page="laporan"> <i class="fas fa-file-invoice"></i> Laporan Kas</li>
            <li data-page="crysta">
                <span class="menu-icon-wrapper"></span>
                Daftar Crysta
            </li>
            <li data-page="saran"><i class="fas fa-envelope"></i> Kotak Saran</li>
        </ul>
    </div>

    <!-- ===== KONTEN UTAMA ===== -->
    <div class="main-content" id="mainContent">
        <!-- Konten akan diisi oleh masing-masing menu -->
    </div>

    <!-- ===== TOAST (untuk saran) ===== -->
    <div class="toast-message" id="toastMessage"></div>

    <!-- ===== JAVASCRIPT ===== -->
    <script src="js/gate.js"></script>
    <script src="js/crysta-icons.js"></script> 
    <script src="js/app.js"></script>
    <script src="js/event.js"></script>
    <script src="js/kas.js"></script>
    <script src="js/crysta.js"></script>
    <script src="js/saran.js"></script>
</body>
</html>
